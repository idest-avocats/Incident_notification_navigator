*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}

.topband{height:6px;background:var(--rose)}
.wrap{max-width:900px;margin:0 auto;padding:26px 20px 40px}
header{position:relative;padding-right:28px}
header::after{content:"";position:absolute;right:0;top:4px;width:6px;height:64px;background:var(--orange)}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.firm{font-weight:700;color:var(--rose);font-size:14px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.theme button{font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:transparent;border:0;padding:5px 11px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--nbg);color:#fff}
h1{font-family:var(--head);font-size:32px;line-height:1.12;font-weight:700;margin:4px 0 0}
.beta{display:inline-block;vertical-align:middle;margin-left:10px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--rose);border:1.5px solid var(--rose);border-radius:999px;padding:1px 8px}
header p{margin:8px 0 0;color:var(--muted);max-width:76ch}
.caution{margin-top:16px;background:var(--caution-bg);color:var(--caution-ink);border-left:5px solid var(--orange);border-radius:6px;padding:11px 14px;font-size:14.5px;max-width:84ch}
.caution a{color:inherit;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:22px;margin-top:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--rose);border-radius:8px;padding:20px}
.panel.result{border-top-color:var(--turq)}
h2{font-family:var(--head);font-size:17px;margin:18px 0 8px}
h2:first-child{margin-top:0}
.q{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:11px 14px;margin-bottom:9px}
.q.sub{margin-left:18px;border-left:4px solid var(--turq)}
.q p{margin:0 0 7px;font-weight:700;font-size:14.5px}
.q small{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;color:var(--ink);padding:7px 13px;border:1px solid var(--line);background:var(--field);border-radius:6px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--nbg);border-color:var(--nbg);color:#fff;font-weight:700}
.chk label{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;margin-bottom:5px;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer;font-size:14px}
.chk label.on{border-color:var(--turq);font-weight:700}
.chk input{accent-color:var(--rose);margin-top:3px}
details{margin-top:8px;font-size:13.5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--turq);font-weight:700}
details ul{margin:6px 0 0;padding-left:18px}
details.mini{margin-top:12px;border:1px solid var(--line);border-radius:6px;padding:8px 12px}

button:focus-visible,summary:focus-visible,input:focus{outline:3px solid color-mix(in srgb,var(--rose) 40%,transparent);outline-offset:1px}
.mx{display:grid;grid-template-columns:auto repeat(4,1fr);gap:3px;font-size:12.5px;margin-top:4px}
.mx .yl,.mx .xl{color:var(--muted);display:flex;align-items:center;padding:2px 6px}
.mx .yl{justify-content:flex-end;text-align:right}.mx .xl{justify-content:center;text-align:center}
.mx button{height:38px;border:2px solid var(--soft);border-radius:4px;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:#fff}
.mx .lo{background:#069297}.mx .me{background:#B87400}.mx .hi{background:#E61E6E}
.mx button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.axis{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lvl{margin-top:8px;font-weight:700}
.sum{padding:12px 16px;border-left:5px solid var(--rose);background:var(--sum-bg);border-radius:6px;margin-bottom:12px;font-size:16.5px}
.card{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px;padding:11px 16px;margin-bottom:10px;background:var(--panel)}
.card h3{margin:0;font-size:16.5px;font-family:var(--head);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--font);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:#77777B;text-transform:uppercase;letter-spacing:.04em}
.card.req{border-left-color:var(--rose)}.req .tag{background:var(--rose)}
.card.chkc{border-left-color:var(--orange)}.chkc .tag{background:#9A6200}
.card.opt{border-left-color:var(--turq)}.opt .tag{background:var(--turq)}
.card.no{background:var(--soft);color:var(--muted)}
.when{font-weight:700;margin:5px 0 2px}.when .d{color:var(--rose)}
.card p{margin:3px 0;font-size:14.5px}.basis{font-size:12.5px!important;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:6px;border:1.5px solid var(--rose);background:var(--panel);color:var(--rose);cursor:pointer;margin:6px 6px 0 0}
footer{margin-top:30px;color:var(--muted);font-size:13px}
footer p{margin:6px 0;max-width:92ch}footer a{color:var(--rose)}
.bottomband{background:var(--rose);color:#fff;font-size:13px}
.bottomband .wrap{padding-top:12px;padding-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media print{.btn,.toggles,.bottomband{display:none}.grid{grid-template-columns:1fr}body,html{background:#fff}}
</style>

function addWorkH(t,h){var x=new Date(t.getTime());while(x.getDay()===0||x.getDay()===6){x.setDate(x.getDate()+1);x.setHours(0,0,0,0)}
